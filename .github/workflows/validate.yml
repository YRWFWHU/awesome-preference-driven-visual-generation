name: Validate catalog
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate metadata and local links (offline)
        run: python scripts/validate.py
      - name: Check generated files (offline)
        run: python scripts/build.py --check
      - name: Test maintenance tools (offline)
        run: python -m unittest discover -s tests
